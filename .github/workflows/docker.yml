name: Docker Build

# Builds what the Verify workflow passed on a push to main or of a release tag, once that very run
# succeeded. Reacting to the run rather than waiting on the commit's checks keeps a build from
# waiting for another branch that happens to sit on the same commit, as the next release branch does
# on the released one, and holds no runner while Verify works.
on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [main, 'v*']
  # A feature branch is built on request rather than on every push. Each build pulls a full set of
  # dependencies, and a branch pushed to twenty times a day pulled them twenty times.
  workflow_dispatch:

jobs:
  # What is built: the commit Verify passed, or the branch a build was asked for, and whether that is
  # main or a release tag. Only pushes count, so a pull request's run never reaches the registry.
  source:
    runs-on: ubuntu-latest
    name: Work out what to build
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      ref_type: ${{ steps.source.outputs.ref_type }}
      ref_name: ${{ steps.source.outputs.ref_name }}
    steps:
      - id: source
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ -z "$RUN_SHA" ]; then
            printf 'sha=%s\nref_type=%s\nref_name=%s\n' "$GITHUB_SHA" "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME"
          elif [[ "$RUN_BRANCH" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'sha=%s\nref_type=tag\nref_name=%s\n' "$RUN_SHA" "$RUN_BRANCH"
          else
            printf 'sha=%s\nref_type=branch\nref_name=%s\n' "$RUN_SHA" "$RUN_BRANCH"
          fi >> "$GITHUB_OUTPUT"

  # Native runners rather than emulation: the backend installs LibreOffice and runs a Gradle build,
  # and under QEMU that takes the better part of an hour.
  build:
    needs: source
    runs-on: ${{ matrix.runner }}
    name: Build ${{ matrix.name }} (${{ matrix.arch }})
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name: [backend, frontend]
        arch: [amd64, arm64]
        include:
          - name: backend
            file: docker/backend.Dockerfile
            image: ghcr.io/rainbowdashlabs/ember-backend
          - name: frontend
            file: docker/frontend.Dockerfile
            image: ghcr.io/rainbowdashlabs/ember-frontend
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      # The whole history, because the backend build reads the tags to record when each version was
      # released. A shallow checkout carries none of them and the changelog page then shows no dates.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
      - uses: gradle/actions/wrapper-validation@v6
        if: matrix.name == 'backend'

      - name: Set up buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the project version
        id: version
        run: echo "version=$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Build Image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/${{ matrix.arch }}
          build-args: |
            EMBER_VERSION=${{ steps.version.outputs.version }}
            GITHUB_ACTIONS=true
            GITHUB_REF_TYPE=${{ needs.source.outputs.ref_type }}
            GITHUB_REF_NAME=${{ needs.source.outputs.ref_name }}
            GITHUB_SHA=${{ needs.source.outputs.sha }}
          outputs: type=image,name=${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          # Kept in the registry rather than the Actions cache, which is ten gigabytes for the whole
          # repository and is where the Gradle caches now live. A tag of its own per image and
          # architecture, because one overwritten by the next build caches nothing.
          cache-from: type=registry,ref=${{ matrix.image }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ matrix.image }}:buildcache-${{ matrix.arch }},mode=max

      # Named after the digest, holding the architecture, so the publish job can check what was
      # built without being told the list a second time.
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p /tmp/digests
          printf '%s' "$ARCH" > "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.name }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # The build jobs push untagged images. Every tag is created here in one call, so a tag is never
  # briefly single-architecture.
  publish:
    needs: [source, build]
    runs-on: ubuntu-latest
    name: Publish ${{ matrix.name }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            image: ghcr.io/rainbowdashlabs/ember-backend
          - name: frontend
            image: ghcr.io/rainbowdashlabs/ember-frontend

    steps:
      # No buildx setup here: imagetools talks to the registry directly and never reaches a builder.
      - name: Download the digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.name }}-*
          merge-multiple: true

      - name: Login to Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every build carries its commit; main also `dev`, a feature branch built on request its branch
      # name, and a release `latest` with its version at three depths.
      - name: Work out which tags this is
        id: meta
        uses: docker/metadata-action@v6
        env:
          IS_MAIN: ${{ github.event_name == 'workflow_run' && needs.source.outputs.ref_name == 'main' }}
          IS_FEATURE: ${{ github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/feature/') }}
          IS_RELEASE: ${{ needs.source.outputs.ref_type == 'tag' }}
          VERSION: ${{ needs.source.outputs.ref_name }}
        with:
          images: ${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.source.outputs.sha }}
            type=raw,value=dev,enable=${{ env.IS_MAIN }}
            type=ref,event=branch,enable=${{ env.IS_FEATURE }}
            type=raw,value=latest,enable=${{ env.IS_RELEASE }}
            type=semver,pattern=v{{version}},value=${{ env.VERSION }},enable=${{ env.IS_RELEASE }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ env.VERSION }},enable=${{ env.IS_RELEASE }}
            type=semver,pattern=v{{major}},value=${{ env.VERSION }},enable=${{ env.IS_RELEASE }}

      - name: Create the manifest list
        uses: nick-fields/retry@v4
        env:
          IMAGE: ${{ matrix.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        with:
          timeout_minutes: 10
          max_attempts: 3
          shell: bash
          command: |
            arguments=()
            for tag in $TAGS; do
              arguments+=(-t "$tag")
            done
            for digest in /tmp/digests/*; do
              arguments+=("$IMAGE@sha256:$(basename "$digest")")
            done
            docker buildx imagetools create "${arguments[@]}"

      - name: Check every architecture is there
        env:
          IMAGE: ${{ matrix.image }}
          COMMIT_SHA: ${{ needs.source.outputs.sha }}
        run: |
          published=$(docker buildx imagetools inspect "$IMAGE:$COMMIT_SHA")
          echo "$published"
          for digest in /tmp/digests/*; do
            arch=$(cat "$digest")
            echo "$published" | grep -q "Platform:.*linux/$arch" \
              || { echo "::error::$IMAGE:$COMMIT_SHA carries no linux/$arch image."; exit 1; }
          done
