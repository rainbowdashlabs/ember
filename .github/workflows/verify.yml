name: Verify

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  merge_group:

env:
  JAVA_VERSION: 25
  PYTHON_VERSION: 3.14
  NODE_VERSION: 24
  # Typst is not packaged by any distribution, so it comes from its own release.
  TYPST_VERSION: 0.14.2

jobs:
  verify-build-backend:
    runs-on: ubuntu-latest
    name: Verify Backend Build
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/wrapper-validation@v6
      - name: Build with Gradle
        run: ./gradlew --build-cache build -x test -x spotlessCheck -x javadoc

  verify-test-repositories:
    runs-on: ubuntu-latest
    name: Verify Repository Tests
    needs: verify-build-backend
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Run repository tests
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 15
          max_attempts: 2
          command: ./gradlew --build-cache testRepositories
      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-repositories
          path: build/jacoco/testRepositories.exec

  verify-test-services:
    runs-on: ubuntu-latest
    name: Verify Service Tests
    needs: verify-build-backend
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      # The packages are large and come from a mirror that is occasionally slow: the same step has
      # taken twenty seconds and ten minutes on consecutive runs. Keeping the downloads means a
      # good run does not reach for the mirror at all, and the timeouts mean a bad one gives up
      # rather than spending a quarter of an hour trying.
      #
      # The key is the versions the packages resolve to rather than their names. Keyed by name the
      # cache would be written once and never again, because a hit does not save: the first time
      # Ubuntu moved a package the entry would go stale and quietly stop helping.
      - name: Work out which versions the tools resolve to
        id: tools
        timeout-minutes: 3
        run: |
          sudo apt-get update
          versions=$(apt-cache policy libreoffice-core libreoffice-impress pandoc webp qpdf \
            | sed -n 's/^  Candidate: //p' | tr ':~+' '---' | paste -sd-)
          echo "key=$versions" >> "$GITHUB_OUTPUT"
      - name: Restore the external tools
        uses: actions/cache@v4
        with:
          path: |
            ~/tool-cache/apt
            ~/tool-cache/typst
          key: external-tools-${{ runner.os }}-${{ steps.tools.outputs.key }}-typst-${{ env.TYPST_VERSION }}
      - name: Install external tools
        timeout-minutes: 6
        env:
          PACKAGES: libreoffice-core libreoffice-impress pandoc webp qpdf
        run: |
          mkdir -p ~/tool-cache/apt ~/tool-cache/typst

          # Anything kept from an earlier run counts as already downloaded, so the download below
          # fetches only what is missing. It has to happen after `apt-get update`, which empties
          # this directory on some images.
          sudo cp ~/tool-cache/apt/*.deb /var/cache/apt/archives/ 2>/dev/null || true

          # Downloading and installing are separate so that what gets kept does not depend on apt
          # leaving the packages behind after it has installed them.
          sudo apt-get install -y -d --no-install-recommends -o APT::Keep-Downloaded-Packages=true $PACKAGES
          sudo cp /var/cache/apt/archives/*.deb ~/tool-cache/apt/ 2>/dev/null || true
          sudo chown -R "$USER" ~/tool-cache/apt

          sudo apt-get install -y --no-install-recommends $PACKAGES

          if [ ! -x ~/tool-cache/typst/typst ]; then
            curl -fsSL --retry 3 --retry-delay 5 --max-time 180 \
              "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
              | tar -xJ -C ~/tool-cache/typst --strip-components=1 typst-x86_64-unknown-linux-musl/typst
          fi
          sudo install -m 0755 ~/tool-cache/typst/typst /usr/local/bin/typst
      - name: Run service tests
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 15
          max_attempts: 2
          command: ./gradlew --build-cache testServices
      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-services
          path: build/jacoco/testServices.exec

  verify-test-tracking:
    runs-on: ubuntu-latest
    name: Verify Data Tracking
    needs: verify-build-backend
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      # Tracking tests enforce that data_tracking.json is in sync with the live PG schema -
      # every DB table is tracked, no stale entries, table hashes match the live columns/FKs,
      # no UNVERIFIED statuses remain, RETAIN strategies carry a legal basis, etc. They use a
      # testcontainer to spin up PostgreSQL.
      - name: Run data tracking tests
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 15
          max_attempts: 2
          command: ./gradlew --build-cache testTracking
      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-tracking
          path: build/jacoco/testTracking.exec

  verify-test-other:
    runs-on: ubuntu-latest
    name: Verify Other Tests
    needs: verify-build-backend
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Run other tests
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 15
          max_attempts: 2
          command: ./gradlew --build-cache testOther
      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-other
          path: build/jacoco/testOther.exec

  verify-coverage:
    runs-on: ubuntu-latest
    name: Verify Coverage
    needs: [verify-test-repositories, verify-test-services, verify-test-tracking, verify-test-other]
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Download coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: jacoco-*
          path: build/jacoco
          merge-multiple: true
      - name: Verify coverage thresholds
        run: ./gradlew --build-cache jacocoCoverageCheck -x test -x testRepositories -x testServices -x testTracking -x testOther

  verify-javadoc:
    runs-on: ubuntu-latest
    name: Verify Javadoc
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Generate Javadoc
        run: ./gradlew javadoc

  verify-build-frontend:
    runs-on: ubuntu-latest
    name: Verify Frontend Build
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        run: NODE_OPTIONS="--max-old-space-size=8192" npm run build
      - name: Pack the build
        working-directory: frontend
        run: tar czf frontend-build.tar.gz .output
      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: frontend/frontend-build.tar.gz
          retention-days: 1

  verify-test-frontend:
    runs-on: ubuntu-latest
    name: Verify Frontend Tests
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run unit and component tests
        working-directory: frontend
        run: NODE_OPTIONS="--max-old-space-size=8192" npx vitest run --coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/

  verify-test-frontend-e2e:
    runs-on: ubuntu-latest
    name: Verify Frontend End-to-End
    needs: [ verify-build-frontend ]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: frontend
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Download the build
        uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: frontend
      - name: Unpack the build
        working-directory: frontend
        run: tar xzf frontend-build.tar.gz
      # The suite brings up its own stack - a database and a backend of its own, and the built server
      # in front of them - because that is what it is configured against. Starting another backend
      # here would only occupy a port nothing asks for.
      - name: Run the end-to-end stories
        working-directory: frontend
        run: npx playwright test --project chromium --project ssr-no-js
      - name: Upload the report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/e2e/report/
      # What the stack was doing, kept only when something went wrong. A story that fails because
      # the backend was unhappy for half a minute looks exactly like a story that fails because it
      # is wrong, and the report alone cannot tell them apart.
      - name: Capture the stack logs
        if: failure()
        run: docker compose -f docker/compose.dev.yaml --profile e2e logs --no-color --timestamps > stack-logs.txt
      - name: Upload the stack logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-stack-logs
          path: stack-logs.txt
      - name: Stop the stack
        if: always()
        run: docker compose -f docker/compose.dev.yaml --profile e2e down -v

  verify-formatting-backend:
    runs-on: ubuntu-latest
    name: Verify Backend Formatting
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Check formatting and license headers
        run: ./gradlew spotlessJavaCheck

  verify-formatting-frontend:
    runs-on: ubuntu-latest
    name: Verify Frontend Formatting
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Check formatting and license headers
        run: ./gradlew spotlessJavascriptCheck spotlessVueCheck

  verify-locales:
    runs-on: ubuntu-latest
    name: Verify Locales
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Check locale encoding
        run: ./gradlew spotlessFrontendLocalesCheck

  # A database that has run a patch is never offered it again, so a patch may not change once it
  # exists on main. Every test builds its database from nothing, which is the one path where such
  # an edit is invisible: the from-nothing database runs the edited file and looks correct, while
  # every running instance skips it and silently lacks whatever was added.
  verify-migrations-frozen:
    runs-on: ubuntu-latest
    name: Verify Migrations Are Frozen
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check that no existing migration was changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          base=$(git merge-base "$BASE_SHA" HEAD)
          touched=$(git diff --name-only --diff-filter=MDR "$base" HEAD -- \
            'src/main/resources/database/postgresql/**/patch_*.sql' \
            'src/main/resources/database/postgresql/**/setup.sql')

          if [ -z "$touched" ]; then
            echo "No existing migration was changed."
            exit 0
          fi

          echo "These migrations already exist and were changed or removed:"
          printf '  %s\n' $touched
          echo

          # Repairing a mistake in a patch that is already on main means changing that patch, so
          # the rule needs a way to be set aside on purpose. A marker in a commit message is that
          # acknowledgement, and it stays in the history next to the change it permits.
          if git log "$base..HEAD" --format=%B | grep -qiF '[modify patch]'; then
            echo "Acknowledged by [modify patch] in a commit on this branch."
            exit 0
          fi

          echo "A database that has applied a patch is never offered it again, so a change to one"
          echo "reaches new databases only. Restore the file and add a new patch instead, raising"
          echo "src/main/resources/database/version to match."
          echo
          echo "When the change is the point, put [modify patch] in a commit message on this branch."
          exit 1

  verify-docker:
    runs-on: ubuntu-latest
    name: Verify Docker Build
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build . -f docker/backend.Dockerfile
      - name: Build frontend image
        run: docker build . -f docker/frontend.Dockerfile
