name: Verify

on:
  push:
    # The dependency branches carry no pull request, so a push is the only thing that verifies them.
    branches: [main, 'feature/**', 'fix/**', 'renovate/**']
    tags: ['v*']
  pull_request:
  merge_group:

env:
  JAVA_VERSION: 25
  NODE_VERSION: 24
  # Typst is not packaged by any distribution, so it comes from its own release.
  TYPST_VERSION: 0.14.2

jobs:
  verify-build-backend:
    runs-on: ubuntu-latest
    name: Verify Backend Build
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      # setup-gradle rather than the `cache: gradle` that setup-java offers. That one writes its
      # entry once and never updates it, so the first job to finish froze a near-empty cache and
      # every job since re-fetched the whole dependency graph while reporting a cache hit. This
      # keys an entry per job, and validates the wrapper on its own.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      # Built once here rather than inside each e2e container, twice a group and five groups over.
      - name: Build the runnable distribution
        run: ./toolchain.sh be-dist --build-cache
      - name: Check formatting, license headers and locale encoding
        run: ./toolchain.sh format-check
      - name: Generate Javadoc
        run: ./toolchain.sh be-javadoc --build-cache
      - name: Pack the distribution
        run: tar czf backend-dist.tar.gz -C build/install ember
      - name: Upload the distribution
        uses: actions/upload-artifact@v7
        with:
          name: backend-dist
          path: backend-dist.tar.gz

  verify-test-backend:
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}
    # Only to catch a job that has genuinely wedged, which would otherwise sit for six hours. It is
    # far above anything a slow run has taken, on purpose: a run that is merely slow should finish
    # and go green rather than turn red and need starting again by hand.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: testRepositories
            name: Verify Repository Tests
          - suite: testServices
            name: Verify Service Tests
            tools: true
          - suite: testOther
            name: Verify Other Tests
          - suite: testTracking
            name: Verify Data Tracking
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      # The packages are large and come from mirrors that are occasionally slow: the same step has
      # taken twenty seconds and ten minutes on consecutive runs. Keeping the downloads means a run
      # that hits the cache does not reach for a mirror at all.
      #
      # The key is the versions the packages resolve to rather than their names. Keyed by name the
      # cache would be written once and never again, because a hit does not save: the first time
      # Ubuntu moved a package the entry would go stale and quietly stop helping.
      - name: Work out which versions the tools resolve to
        if: matrix.tools
        id: tools
        run: |
          sudo apt-get update
          versions=$(apt-cache policy libreoffice-core libreoffice-impress pandoc webp qpdf \
            | sed -n 's/^  Candidate: //p' | tr ':~+' '---' | paste -sd-)
          echo "key=$versions" >> "$GITHUB_OUTPUT"
      - name: Restore the external tools
        if: matrix.tools
        uses: actions/cache@v6
        with:
          path: |
            ~/tool-cache/apt
            ~/tool-cache/typst
          key: external-tools-${{ runner.os }}-${{ steps.tools.outputs.key }}-typst-${{ env.TYPST_VERSION }}
      - name: Install external tools
        if: matrix.tools
        env:
          PACKAGES: libreoffice-core libreoffice-impress pandoc webp qpdf
        run: |
          mkdir -p ~/tool-cache/apt ~/tool-cache/typst

          # Anything kept from an earlier run counts as already downloaded, so the download below
          # fetches only what is missing. It has to happen after `apt-get update`, which empties
          # this directory on some images.
          sudo cp ~/tool-cache/apt/*.deb /var/cache/apt/archives/ 2>/dev/null || true

          # Downloading and installing are separate so that what gets kept does not depend on apt
          # leaving the packages behind after it has installed them.
          sudo apt-get install -y -d --no-install-recommends -o APT::Keep-Downloaded-Packages=true $PACKAGES
          sudo cp /var/cache/apt/archives/*.deb ~/tool-cache/apt/ 2>/dev/null || true
          sudo chown -R "$USER" ~/tool-cache/apt

          sudo apt-get install -y --no-install-recommends $PACKAGES

          if [ ! -x ~/tool-cache/typst/typst ]; then
            # Aborts on a stalled connection, not on a slow one: below a kilobyte a second for a
            # minute is a download that has stopped, while a slow one should be left to finish.
            curl -fsSL --retry 3 --retry-delay 5 --speed-limit 1000 --speed-time 60 \
              "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
              | tar -xJ -C ~/tool-cache/typst --strip-components=1 typst-x86_64-unknown-linux-musl/typst
          fi
          sudo install -m 0755 ~/tool-cache/typst/typst /usr/local/bin/typst
      - name: Run the tests
        timeout-minutes: 15
        run: ./toolchain.sh be-suite ${{ matrix.suite }} --build-cache
      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-${{ matrix.suite }}
          path: build/jacoco/${{ matrix.suite }}.exec

  verify-coverage:
    runs-on: ubuntu-latest
    name: Verify Coverage
    needs: verify-test-backend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Download coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: jacoco-*
          path: build/jacoco
          merge-multiple: true
      - name: Build the coverage report and check the gates
        env:
          COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || 'origin/main' }}
        run: ./toolchain.sh be-coverage --build-cache
      - name: Upload the coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: build/reports/jacoco/jacocoFullReport/

  verify-build-frontend:
    runs-on: ubuntu-latest
    name: Verify Frontend Build
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: ./toolchain.sh fe-install-clean
      - name: Lint frontend
        run: ./toolchain.sh fe-lint
      - name: Build frontend
        run: ./toolchain.sh fe-bundle
      - name: Pack the build
        working-directory: frontend
        run: tar czf frontend-build.tar.gz .output
      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: frontend/frontend-build.tar.gz
          retention-days: 1

  verify-test-frontend:
    runs-on: ubuntu-latest
    name: Verify Frontend Tests
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: ./toolchain.sh fe-install-clean
      - name: Run unit and component tests
        run: ./toolchain.sh fe-coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/

  verify-test-frontend-e2e:
    runs-on: ubuntu-latest
    # Divided by area, so a red job names where to look. Each brings up a stack of its own.
    name: Verify Frontend End-to-End (${{ matrix.group }})
    needs: [ verify-build-frontend, verify-build-backend ]
    timeout-minutes: 20
    env:
      E2E_PREBUILT: "1"
      E2E_PREBUILT_READY: "1"
    strategy:
      fail-fast: false
      matrix:
        group: [ cluster, inventory, station, instance, account ]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: ./toolchain.sh fe-install-clean
      - name: Install Playwright browsers
        timeout-minutes: 5
        run: ./toolchain.sh fe-e2e-install
      - name: Download the build
        uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: frontend
      - name: Unpack the build
        working-directory: frontend
        run: tar xzf frontend-build.tar.gz
      - name: Download the backend distribution
        uses: actions/download-artifact@v8
        with:
          name: backend-dist
      - name: Unpack the backend distribution
        run: mkdir -p build/install && tar xzf backend-dist.tar.gz -C build/install
      - name: Check every story is in a group
        run: ./toolchain.sh fe-e2e-groups
      # The suite brings up its own stack - a database and a backend of its own, and the built server
      # in front of them - because that is what it is configured against. Starting another backend
      # here would only occupy a port nothing asks for.
      - name: Run the end-to-end stories
        run: ./toolchain.sh fe-e2e-group ${{ matrix.group }}
      - name: Upload the report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.group }}
          path: frontend/e2e/report/
      # What the stack was doing, kept only when something went wrong. A story that fails because
      # the backend was unhappy for half a minute looks exactly like a story that fails because it
      # is wrong, and the report alone cannot tell them apart.
      - name: Capture the stack logs
        if: failure()
        run: ./toolchain.sh docker-e2e-logs --no-color --timestamps > stack-logs.txt
      - name: Upload the stack logs
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-stack-logs-${{ matrix.group }}
          path: stack-logs.txt
      - name: Stop the stack
        if: always()
        run: ./toolchain.sh docker-e2e-down -v

  # One name for however many runs there turn out to be, so splitting them again leaves branch
  # protection alone. `always()`, or a skipped job would never report and the check could never pass.
  verify-test-frontend-e2e-complete:
    runs-on: ubuntu-latest
    name: Verify Frontend End-to-End
    needs: [ verify-test-frontend-e2e ]
    if: always()
    steps:
      - name: Say whether the runs passed
        env:
          RESULT: ${{ needs.verify-test-frontend-e2e.result }}
        run: |
          echo "The end-to-end runs came to: $RESULT"
          [ "$RESULT" = "success" ] || exit 1

  verify-repository-rules:
    runs-on: ubuntu-latest
    name: Verify Repository Rules
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # A database that has run a patch is never offered it again, so a patch may not change once it
      # exists on main. Every test builds its database from nothing, which is the one path where such
      # an edit is invisible: the from-nothing database runs the edited file and looks correct, while
      # every running instance skips it and silently lacks whatever was added.
      - name: Check that no existing migration was changed
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          base=$(git merge-base "$BASE_SHA" HEAD)
          touched=$(git diff --name-only --diff-filter=MDR "$base" HEAD -- \
            'src/main/resources/database/postgresql/**/patch_*.sql' \
            'src/main/resources/database/postgresql/**/setup.sql')

          if [ -z "$touched" ]; then
            echo "No existing migration was changed."
            exit 0
          fi

          echo "These migrations already exist and were changed or removed:"
          printf '  %s\n' $touched
          echo

          # Repairing a mistake in a patch that is already on main means changing that patch, so
          # the rule needs a way to be set aside on purpose. A marker in a commit message is that
          # acknowledgement, and it stays in the history next to the change it permits.
          if git log "$base..HEAD" --format=%B | grep -qiF '[modify patch]'; then
            echo "Acknowledged by [modify patch] in a commit on this branch."
            exit 0
          fi

          echo "A database that has applied a patch is never offered it again, so a change to one"
          echo "reaches new databases only. Restore the file and add a new patch instead, raising"
          echo "src/main/resources/database/version to match."
          echo
          echo "When the change is the point, put [modify patch] in a commit message on this branch."
          exit 1
      # A patch that has not reached main has not reached any database either, so several of them on
      # one branch carry no history worth keeping apart and are free to become one file.
      - name: Check that at most one migration is added
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          base=$(git merge-base "$BASE_SHA" HEAD)
          added=$(git diff --name-only --diff-filter=A "$base" HEAD -- \
            'src/main/resources/database/postgresql/**/patch_*.sql')
          count=$(printf '%s' "$added" | grep -c . || true)

          if [ "$count" -le 1 ]; then
            echo "This change adds $count migration(s)."
            exit 0
          fi

          echo "This change adds $count migrations:"
          printf '  %s\n' $added
          echo
          echo "None of them has been applied anywhere, so they can be one file. Merge their"
          echo "statements into the lowest-numbered patch, delete the rest, and set"
          echo "src/main/resources/database/version to that one number."
          exit 1
      - name: Check the project version against the released tags
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts)

          if [ -z "$version" ]; then
            echo "::error::No version line found in build.gradle.kts."
            exit 1
          fi

          if [ "$REF_TYPE" = "tag" ]; then
            if [ "$REF_NAME" != "v$version" ]; then
              echo "::error::Tag $REF_NAME was cut from a build that says $version. Bump the version before tagging."
              exit 1
            fi
            echo "Tag $REF_NAME matches the project version."
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "::error::Version $version is already released as v$version. Bump the version in build.gradle.kts."
            exit 1
          fi
          echo "Version $version is not released yet."

  verify-docker:
    runs-on: ubuntu-latest
    name: Verify Docker Build
    steps:
      - uses: actions/checkout@v7
      - name: Set up buildx
        uses: docker/setup-buildx-action@v4
      # Reads the layers the images on main were built from, and writes none back, so a branch
      # resolves dependencies only where it has changed them. The packages are public, so this
      # needs no credentials, and a branch whose cache is missing simply builds from nothing.
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/backend.Dockerfile
          cache-from: type=registry,ref=ghcr.io/rainbowdashlabs/ember-backend:buildcache-amd64
      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/frontend.Dockerfile
          cache-from: type=registry,ref=ghcr.io/rainbowdashlabs/ember-frontend:buildcache-amd64
