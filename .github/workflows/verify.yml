name: Verify

on: [push, pull_request, merge_group]

env:
  JAVA_VERSION: 25
  PYTHON_VERSION: 3.14
  NODE_VERSION: 24

jobs:
  verify-build-backend:
    runs-on: ubuntu-latest
    name: Verify Backend Build
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/wrapper-validation@v6
      - name: Build with Gradle
        run: ./gradlew --build-cache build -x test -x spotlessCheck -x javadoc

  verify-test-repositories:
    runs-on: ubuntu-latest
    name: Verify Repository Tests
    needs: verify-build-backend
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Run repository tests
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 2
          command: ./gradlew --build-cache testRepositories
      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-repositories
          path: build/jacoco/testRepositories.exec

  verify-test-services:
    runs-on: ubuntu-latest
    name: Verify Service Tests
    needs: verify-build-backend
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Install external tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-core libreoffice-impress pandoc
          curl -fsSL https://github.com/typst/typst/releases/download/v0.14.2/typst-x86_64-unknown-linux-musl.tar.xz | sudo tar -xJ -C /usr/local/bin --strip-components=1 typst-x86_64-unknown-linux-musl/typst
      - name: Run service tests
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 2
          command: ./gradlew --build-cache testServices
      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-services
          path: build/jacoco/testServices.exec

  verify-test-tracking:
    runs-on: ubuntu-latest
    name: Verify Data Tracking
    needs: verify-build-backend
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      # Tracking tests enforce that data_tracking.json is in sync with the live PG schema —
      # every DB table is tracked, no stale entries, table hashes match the live columns/FKs,
      # no UNVERIFIED statuses remain, RETAIN strategies carry a legal basis, etc. They use a
      # testcontainer to spin up PostgreSQL.
      - name: Run data tracking tests
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 2
          command: ./gradlew --build-cache testTracking
      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-tracking
          path: build/jacoco/testTracking.exec

  verify-test-other:
    runs-on: ubuntu-latest
    name: Verify Other Tests
    needs: verify-build-backend
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Run other tests
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 2
          command: ./gradlew --build-cache testOther
      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-other
          path: build/jacoco/testOther.exec

  verify-coverage:
    runs-on: ubuntu-latest
    name: Verify Coverage
    needs: [verify-test-repositories, verify-test-services, verify-test-tracking, verify-test-other]
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: jacoco-*
          path: build/jacoco
          merge-multiple: true
      - name: Verify coverage thresholds
        run: ./gradlew --build-cache jacocoCoverageCheck -x test -x testRepositories -x testServices -x testTracking -x testOther

  verify-javadoc:
    runs-on: ubuntu-latest
    name: Verify Javadoc
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Generate Javadoc
        run: ./gradlew javadoc

  verify-build-frontend:
    runs-on: ubuntu-latest
    name: Verify Frontend Build
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        run: NODE_OPTIONS="--max-old-space-size=8192" npm run build

  verify-formatting-backend:
    runs-on: ubuntu-latest
    name: Verify Backend Formatting
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Check formatting and license headers
        run: ./gradlew spotlessJavaCheck

  verify-formatting-frontend:
    runs-on: ubuntu-latest
    name: Verify Frontend Formatting
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Check formatting and license headers
        run: ./gradlew spotlessJavascriptCheck spotlessVueCheck

  verify-locales:
    runs-on: ubuntu-latest
    name: Verify Locales
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Check locale encoding
        run: ./gradlew spotlessFrontendLocalesCheck

  verify-docker:
    runs-on: ubuntu-latest
    name: Verify Docker Build
    steps:
      - uses: actions/checkout@v6
      - name: Build backend image
        run: docker build . -f docker/backend.Dockerfile
      - name: Build frontend image
        run: docker build . -f docker/frontend.Dockerfile
