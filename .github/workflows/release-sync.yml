name: Release Sync

# Says when a release branch has fallen behind main, and writes to no branch: the rebase rewrites
# commits, so it is run locally with `./toolchain.sh release-sync`, where every rewritten commit is
# signed. For each open release branch that does not contain main it opens one issue (or updates the
# open one), and it closes that issue once the branch contains main. It runs after every push to main,
# after every release, and after a push to a release branch, which is how such an issue is closed.
on:
  push:
    branches: [main, 'release/**']
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check the release branches against main
    runs-on: ubuntu-latest
    concurrency:
      group: release-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Report the release branches behind main
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./toolchain.sh release-sync --check
