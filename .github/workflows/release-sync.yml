name: Release Sync

# Brings what lands on main into every open release branch: rebased onto main, its own migration
# renumbered above main's, pushed with a lease. A conflict it cannot resolve opens an issue. It runs
# after every push to main and after every release. A push to a release branch runs it too, because a
# release branch is skipped until its version bump is merged and would otherwise wait for the next
# push to main; a branch that contains main already is left alone, so its own push ends there.
on:
  push:
    branches: [main, 'release/**']
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    name: Rebase the release branches onto main
    runs-on: ubuntu-latest
    concurrency:
      group: release-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - name: Commit as the workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Rebase, renumber and push
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: ./toolchain.sh release-sync
