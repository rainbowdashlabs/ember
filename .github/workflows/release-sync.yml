name: Release Sync

# Says on each release branch whether it contains main, and writes to no branch: the rebase rewrites
# commits, so it is run locally with `./toolchain.sh release-sync`, where every rewritten commit is
# signed. The answer is the commit status "Release branch contains main" on the branch head, which
# shows on the branch's release pull request. It runs after every push to main, after every release,
# and after a push to a release branch, which is how a synced branch turns green.
on:
  push:
    branches: [main, 'release/**']
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  check:
    name: Check the release branches against main
    runs-on: ubuntu-latest
    concurrency:
      group: release-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Set the status of each release branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./toolchain.sh release-sync --check
