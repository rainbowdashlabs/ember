name: Release Sync

# Brings the fixes released from main into every open release branch: rebased onto main, its own
# migration renumbered above main's, pushed with a lease. A conflict it cannot resolve opens an issue.
# The Release workflow runs it after every release.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    name: Rebase the release branches onto main
    runs-on: ubuntu-latest
    concurrency:
      group: release-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - name: Commit as the workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Rebase, renumber and push
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: ./toolchain.sh release-sync
