name: Release

# A feature release is the pull request from release/vX.Y.Z into main, labelled `release`: main is
# fast-forwarded to the branch head, because none of GitHub's merge buttons can do that. A fix release
# is a merged pull request into main carrying the label, or a run by hand without a number.
on:
  pull_request_target:
    types: [labeled, closed]
  workflow_dispatch:
    inputs:
      pull_request:
        description: The release pull request to release; empty releases the fixes on main
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish the release
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.action == 'labeled' && github.event.label.name == 'release'
          && (startsWith(github.event.pull_request.head.ref, 'release/')
              || (github.event.pull_request.merged && github.event.pull_request.base.ref == 'main')))
      || (github.event.action == 'closed' && github.event.pull_request.merged
          && github.event.pull_request.base.ref == 'main'
          && !startsWith(github.event.pull_request.head.ref, 'release/')
          && contains(github.event.pull_request.labels.*.name, 'release'))
    steps:
      # main's own scripts run, never the pull request's: this trigger holds the release token.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - name: Tag as the workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Work out what to release
        id: what
        env:
          INPUT_PR: ${{ inputs.pull_request }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if [ -n "$INPUT_PR" ]; then
            printf 'kind=feature\npr=%s\n' "$INPUT_PR"
          elif [ -z "$EVENT_PR" ]; then
            printf 'kind=fix\n'
          elif [[ "$HEAD_REF" == release/* ]]; then
            printf 'kind=feature\npr=%s\n' "$EVENT_PR"
          else
            printf 'kind=fix\npr=%s\ncommit=%s\n' "$EVENT_PR" "$MERGE_SHA"
          fi >> "$GITHUB_OUTPUT"
      - name: Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          RELEASE_REPORT: ${{ runner.temp }}/report.md
          KIND: ${{ steps.what.outputs.kind }}
          PR: ${{ steps.what.outputs.pr }}
          COMMIT: ${{ steps.what.outputs.commit }}
        run: |
          if [ "$KIND" = "feature" ]; then
            ./toolchain.sh release-feature "$PR"
          else
            ./toolchain.sh release-fix --wait ${COMMIT:+--commit "$COMMIT"}
          fi
      - name: Report on the pull request
        if: success() && steps.what.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          PR: ${{ steps.what.outputs.pr }}
          REPORT: ${{ runner.temp }}/report.md
        run: gh pr comment "$PR" --body-file "$REPORT"
      - name: Take the label back and say why
        if: failure() && steps.what.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          PR: ${{ steps.what.outputs.pr }}
          REPORT: ${{ runner.temp }}/report.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr edit "$PR" --remove-label release || true
          {
            echo "The release did not go ahead, so the \`release\` label was removed. Add it again once this is resolved."
            echo
            cat "$REPORT" 2> /dev/null || true
            echo
            echo "Run: $RUN_URL"
          } > "$RUNNER_TEMP/refusal.md"
          gh pr comment "$PR" --body-file "$RUNNER_TEMP/refusal.md"
