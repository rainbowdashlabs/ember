        <h1>Ember — Deine Jugendfeuerwehr. Digital organisiert.</h1>
        <p>Ember ist die All-in-One-Plattform für Jugendfeuerwehren und Jugendgruppen. Anwesenheit, Termine, Inventar, Mitglieder — alles an einem Ort.</p>

        <h2>Funktionen</h2>
        <ul>
          <li><strong>Anwesenheit</strong> — Erfasse die Anwesenheit bei Übungen und Terminen. Nutze Vorlagen für wiederkehrende Übungen und erstelle Berichte als PDF.</li>
          <li><strong>Termine &amp; Veranstaltungen</strong> — Plane wiederkehrende Übungen, monatliche Treffen und Sonderveranstaltungen. Mitglieder können sich direkt anmelden oder absagen.</li>
          <li><strong>Inventar &amp; Ausrüstung</strong> — Verwalte die Ausrüstung deiner Mitglieder. Weise Helme, Stiefel und Kleidung zu. Tausch-Anfragen und Beschaffung inklusive.</li>
          <li><strong>Mitgliederverwaltung</strong> — Lege Mitglieder an, ordne sie Gruppen zu und verwalte ihre Profile. Eltern können als Erziehungsberechtigter ihre Kinder betreuen.</li>
          <li><strong>Formulare &amp; Umfragen</strong> — Erstelle Umfragen mit verschiedenen Fragetypen — Multiple-Choice, Bewertungen, Freitext und mehr.</li>
          <li><strong>Neuigkeiten</strong> — Halte alle auf dem Laufenden. Veröffentliche Neuigkeiten mit Kommentarfunktion.</li>
          <li><strong>Fundbüro</strong> — Verlorene Gegenstände melden und wiederfinden. Mit Foto-Upload und Benachrichtigungen.</li>
        </ul>

        <h2>Warum Ember?</h2>
        <ul>
          <li><strong>Für jedes Gerät</strong> — Funktioniert auf dem Handy, Tablet und PC — ohne App-Installation.</li>
          <li><strong>Sicher &amp; geschützt</strong> — Rollenbasierte Zugriffskontrolle. Jeder sieht nur, was er sehen darf.</li>
          <li><strong>DSGVO-konform</strong> — Datenauskunft, Datenexport und Kontolöschung — deine Daten gehören dir.</li>
          <li><strong>Modulare Funktionen</strong> — Aktiviere nur, was ihr braucht. Nicht benötigte Module einfach ausschalten.</li>
          <li><strong>Wach-Transfer</strong> — Übertrage deine Wache sicher auf eine andere Instanz.</li>
          <li><strong>PDF-Exporte</strong> — Anwesenheitslisten, Terminübersichten und Inventarlisten als PDF herunterladen.</li>
          <li><strong>Hilfe-Center</strong> — Zu jeder Seite gibt es eine einfache Erklärung. Ideal auch für die Jüngsten.</li>
        </ul>

        <h2>Für wen ist Ember?</h2>
        <p>Ember wurde für Jugendfeuerwehren entwickelt — funktioniert aber genauso gut für andere Jugendgruppen mit festen Übungszeiten, Mitgliederverwaltung und Ausrüstung.</p>
