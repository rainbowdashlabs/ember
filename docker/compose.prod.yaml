services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ember
      POSTGRES_USER: ember
      POSTGRES_PASSWORD: ember
    volumes:
      - ember-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ember"]
      interval: 5s
      timeout: 3s
      retries: 10

  ember:
    container_name: ember
    image: ghcr.io/rainbowdashlabs/ember:latest
    ports:
      - "8000:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ember
      DB_PASSWORD: ember
      DB_DATABASE: ember
      DB_SCHEMA: ember_schema
    volumes:
      - ./config:/app/config
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  ember-data:
