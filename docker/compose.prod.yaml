services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ember
      POSTGRES_USER: ember
      POSTGRES_PASSWORD: ember
    volumes:
      - ember-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ember"]
      interval: 5s
      timeout: 3s
      retries: 10

  ember:
    container_name: ember
    image: ghcr.io/rainbowdashlabs/ember-backend:${EMBER_TAG:-latest}
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ember
      DB_PASSWORD: ember
      DB_DATABASE: ember
      DB_SCHEMA: ember_schema
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.http.routers.ember-api.rule: "Host(`${EMBER_HOST}`) && PathPrefix(`/api`)"
      traefik.http.routers.ember-api.entrypoints: websecure
      traefik.http.routers.ember-api.tls.certresolver: letsencrypt
      traefik.http.services.ember-api.loadbalancer.server.port: "8080"

  frontend:
    container_name: ember-frontend
    image: ghcr.io/rainbowdashlabs/ember-frontend:${EMBER_TAG:-latest}
    # Where the server render reaches the backend. The browser uses a relative path, which has an
    # origin to resolve against; the server does not, and without this it falls back to its own
    # localhost, where nothing answers. The pages that fetch while rendering - the legal documents -
    # are the ones that fail, and only when opened directly rather than navigated to.
    environment:
      NUXT_BACKEND_URL: http://ember:8080
    depends_on:
      - ember
    labels:
      traefik.enable: "true"
      traefik.http.routers.ember-web.rule: "Host(`${EMBER_HOST}`)"
      traefik.http.routers.ember-web.entrypoints: websecure
      traefik.http.routers.ember-web.tls.certresolver: letsencrypt
      traefik.http.routers.ember-web.priority: "1"
      traefik.http.services.ember-web.loadbalancer.server.port: "3000"

volumes:
  ember-data:
