services:
  postgres:
    image: postgres:18-alpine
    container_name: ember_demo_db
    environment:
      POSTGRES_DB: ember
      POSTGRES_USER: ember
      POSTGRES_PASSWORD: ember
    volumes:
      - demo-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ember"]
      interval: 5s
      timeout: 3s
      retries: 10

  ember:
    container_name: ember_demo
    image: ghcr.io/rainbowdashlabs/ember-backend:${EMBER_TAG:-latest}
    environment:
      DB_HOST: ember_demo_db
      DB_PORT: "5432"
      DB_USER: ember
      DB_PASSWORD: ember
      DB_DATABASE: ember
      DB_SCHEMA: ember_schema
      DEMO_ENABLED: "true"
      DEMO_RESETINTERVALHOURS: "1"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.http.routers.ember-demo-api.rule: "Host(`${EMBER_HOST}`) && PathPrefix(`/api`)"
      traefik.http.routers.ember-demo-api.entrypoints: websecure
      traefik.http.routers.ember-demo-api.tls.certresolver: letsencrypt
      traefik.http.services.ember-demo-api.loadbalancer.server.port: "8080"

  frontend:
    container_name: ember_demo_frontend
    image: ghcr.io/rainbowdashlabs/ember-frontend:${EMBER_TAG:-latest}
    depends_on:
      - ember
    labels:
      traefik.enable: "true"
      traefik.http.routers.ember-demo-web.rule: "Host(`${EMBER_HOST}`)"
      traefik.http.routers.ember-demo-web.entrypoints: websecure
      traefik.http.routers.ember-demo-web.tls.certresolver: letsencrypt
      traefik.http.routers.ember-demo-web.priority: "1"
      traefik.http.services.ember-demo-web.loadbalancer.server.port: "3000"

volumes:
  demo-data:
