services:
  postgres:
    image: postgres:17-alpine
    container_name: ember_dev_db
    environment:
      POSTGRES_DB: ember
      POSTGRES_USER: ember
      POSTGRES_PASSWORD: ember
    ports:
      - "5432:5432"
    volumes:
      - ember-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ember"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for testing the S3 backend variant.
  # Reach the S3 API from the host at http://localhost:9000 and the admin console at
  # http://localhost:9001 (default login: emberadmin / emberadmin). On first boot
  # the rustfs-init container creates an "ember" bucket so the app can store into it
  # straight away.
  rustfs:
    image: rustfs/rustfs:latest
    container_name: ember_dev_rustfs
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: emberadmin
      RUSTFS_SECRET_KEY: emberadmin
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    volumes:
      - ember-dev-rustfs:/data

  # Creates the "ember" bucket on the rustfs instance, then exits. Polls until rustfs
  # answers; the mb call is idempotent so re-running compose-up is safe.
  rustfs-init:
    image: minio/mc:latest
    container_name: ember_dev_rustfs_init
    depends_on:
      - rustfs
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://rustfs:9000 emberadmin emberadmin 2>/dev/null; do
          echo "Waiting for rustfs to come up..."
          sleep 2
        done
        mc mb --ignore-existing local/ember
        echo "rustfs ready: bucket 'ember' available at http://localhost:9000 (key/secret: emberadmin/emberadmin)"

  # SFTP target for testing the SFTP backend variant.
  # Login from the host: ssh -p 2222 ember@localhost (password: ember), files land
  # under /home/ember/upload inside the container.
  #
  # init.sh chowns the volume to the ember user on every container start. atmoz/sftp
  # only chowns the upload directory the first time the named volume is created; after
  # a restart the existing root-owned volume is mounted as-is, leaving the user without
  # write permission. The init script is idempotent and survives compose down/up cycles.
  sftp:
    image: atmoz/sftp:latest
    container_name: ember_dev_sftp
    ports:
      - "2222:22"
    volumes:
      - ember-dev-sftp:/home/ember/upload
      - ./sftp-init.sh:/etc/sftp.d/chown-upload.sh:ro
      - ./test-ssh/ember_ed25519.pub:/home/ember/.ssh/keys/ember_ed25519.pub:ro
    command: "ember:ember:1001::upload"

  # SMB / Samba share for testing the SMB backend variant.
  # Reach the share from the host on smb://localhost/ember (user: ember, password: ember).
  # Inside the container the share root maps to /share so basePath in the Ember
  # config can stay empty.
  smb:
    image: dperson/samba:latest
    container_name: ember_dev_smb
    ports:
      - "1445:445"
    environment:
      USERID: "1000"
      GROUPID: "1000"
    volumes:
      - ember-dev-smb:/share
    command: >-
      -p
      -u "ember;ember"
      -s "ember;/share;yes;no;no;ember;ember"
      -w "WORKGROUP"

  # Dev backend: bind-mounts the project so source edits land in the container
  # straight away, with named volumes for the Gradle home and the project's
  # build/ output so incremental compilation survives across restarts. Trigger
  # a rebuild after editing code with `docker compose restart ember`.
  ember:
    container_name: ember_dev
    build:
      context: ..
      dockerfile: docker/backend.dev.Dockerfile
    ports:
      - "8888:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ember
      DB_PASSWORD: ember
      DB_DATABASE: ember
      DB_SCHEMA: ember_schema
      DEMO_DEV: "true"
    volumes:
      - ..:/home/gradle/project
      - ember-dev-gradle-cache:/home/gradle/.gradle
      - ember-dev-gradle-build:/home/gradle/project/build
      - ./config:/home/gradle/project/config
      - ./data:/home/gradle/project/data
    depends_on:
      postgres:
        condition: service_healthy

  # Dev frontend: Nuxt dev server with HMR. Bind-mounts the source, isolates
  # node_modules in a named volume so the host's install does not shadow it.
  # NUXT_BACKEND_URL points the Nuxt dev proxy at the ember service inside the
  # compose network; the browser talks to Nuxt on :3000 and Nuxt forwards
  # /api/** there.
  frontend:
    container_name: ember_dev_frontend
    build:
      context: ..
      dockerfile: docker/frontend.dev.Dockerfile
    ports:
      - "3000:3000"
    environment:
      NUXT_BACKEND_URL: http://ember:8080
    volumes:
      - ../frontend:/build
      - ember-dev-node-modules:/build/node_modules
    depends_on:
      - ember

volumes:
  ember-dev-data:
  ember-dev-rustfs:
  ember-dev-sftp:
  ember-dev-smb:
  ember-dev-gradle-cache:
  ember-dev-gradle-build:
  ember-dev-node-modules:
