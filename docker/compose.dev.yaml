services:
  postgres:
    image: postgres:17-alpine
    container_name: ember_dev_db
    environment:
      POSTGRES_DB: ember
      POSTGRES_USER: ember
      POSTGRES_PASSWORD: ember
    ports:
      - "5432:5432"
    volumes:
      - ember-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ember"]
      interval: 5s
      timeout: 3s
      retries: 10

  ember:
    container_name: ember_dev
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ember
      DB_PASSWORD: ember
      DB_DATABASE: ember
      DB_SCHEMA: ember_schema
      DEMO_DEV: "true"
    volumes:
      - ./config:/app/config
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  ember-dev-data:
