# Rename the implicit default network to a stable, project-independent name so
# that re-running compose from a different working directory (or with -p)
# doesn't orphan containers against the previous network ID. The "network not
# found" failure that arises after a `down -v` + rename was caused by that.
networks:
  default:
    name: ember_dev

services:
  postgres:
    image: postgres:18-alpine
    container_name: ember_dev_db
    environment:
      POSTGRES_DB: ember
      POSTGRES_USER: ember
      POSTGRES_PASSWORD: ember
    ports:
      - "5432:5432"
    volumes:
      - ember-dev-data:/var/lib/postgresql
    profiles:
      - storage
      - full
      - transfer
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ember"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The end-to-end stack. Its own database, its own backend, its own ports and its own volumes,
  # so a test run can throw the data away whenever it likes without touching what someone is
  # working in. The suite resets this database before every run; doing that to the dev stack
  # would delete the state a developer had just set up by hand.
  postgres-e2e:
    image: postgres:18-alpine
    container_name: ember_e2e_db
    environment:
      POSTGRES_DB: ember
      POSTGRES_USER: ember
      POSTGRES_PASSWORD: ember
    ports:
      - "5434:5432"
    volumes:
      - ember-e2e-data:/var/lib/postgresql
    profiles:
      - e2e
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ember"]
      interval: 5s
      timeout: 3s
      retries: 10

  ember-e2e:
    container_name: ember_e2e
    build:
      context: ..
      dockerfile: docker/backend.dev.Dockerfile
    ports:
      - "8899:8080"
    environment:
      DB_HOST: postgres-e2e
      DB_PORT: "5432"
      DB_USER: ember
      DB_PASSWORD: ember
      DB_DATABASE: ember
      DB_SCHEMA: ember_schema
      DEMO_DEV: "true"
      # Never the public demo, whatever the shared config file says. That mode blocks the very
      # actions several stories walk through - a station application, a public waiting-list
      # registration, lending across stations - and turns the login page into an account picker,
      # so a developer who switched their own instance to it would watch this suite fail for
      # reasons that have nothing to do with their change.
      DEMO_ENABLED: "false"
      # A fixed key for this throwaway container, because SecretsInitializer deliberately generates
      # nothing on a dev instance: it would rewrite the committed config file. Without a key every
      # storage-backend apply answers with a cipher error, and the cause is nowhere near the symptom.
      # What it encrypts here are the credentials of three containers on a private network.
      STORAGE_CREDENTIALENCRYPTIONKEY: "ZTJlLXN0YWNrLW9ubHkta2V5LW5vdC1hLXNlY3JldCE="
      # Every address a private one, which the outbound URL validator refuses on a real
      # instance for good reason: a peer named "ember-e2e-peer" or "localhost" is exactly what
      # an attacker would supply to make the server scan its own network. The flag exists for
      # this situation and is set nowhere but here and in the tests.
      FEDERATION_ALLOWPRIVATEHOSTS: "true"
      API_BASEURL: http://localhost:3010
    volumes:
      - ..:/home/gradle/project
      - ember-e2e-gradle-cache:/home/gradle/.gradle
      - ember-e2e-gradle-build:/home/gradle/project/build
      - ember-e2e-project-gradle:/home/gradle/project/.gradle
      - ./config:/home/gradle/project/config
      - ember-e2e-app-data:/home/gradle/project/data
    depends_on:
      postgres-e2e:
        condition: service_healthy
    profiles:
      - e2e

  # The second instance the stories federate against. A real counterpart rather than a second
  # station of the first one: its own schema, its own port, its own data directory, and no way
  # of seeing the first instance's rows.
  #
  # It shares the database container and splits off by schema. The whole schema is a
  # parameter - the migrations, the connection's search path and the reset all take it from
  # DB_SCHEMA - so two instances in one database never meet, and one postgres is one less
  # container to wait for.
  #
  # Reachable two ways, and which one to use depends on who is asking:
  #   - from the host and from the stories:      http://localhost:8898
  #   - from the other backend's container:      http://ember-e2e-peer:8080
  # The second is the address that goes into a federation invite or a discovery peer entry,
  # because the caller there is a container and not a browser. Hyphens, not underscores: Java's
  # URI parser answers a null host for a name containing one.
  #
  # No frontend of its own. Everything a story does as this instance - discovering its accounts,
  # signing in, reading and writing - is API work, and a second built Nuxt server would cost
  # every run a process and a port for no story that exists.
  ember-e2e-peer:
    container_name: ember_e2e_peer
    build:
      context: ..
      dockerfile: docker/backend.dev.Dockerfile
    ports:
      - "8898:8080"
    environment:
      DB_HOST: postgres-e2e
      DB_PORT: "5432"
      DB_USER: ember
      DB_PASSWORD: ember
      DB_DATABASE: ember
      # The one line that separates the two instances. It reaches the migrations, the pool's
      # search path and the reset endpoint alike, so this instance runs its own migrations and
      # sees none of the first instance's tables.
      DB_SCHEMA: ember_peer_schema
      DEMO_DEV: "true"
      DEMO_ENABLED: "false"
      STORAGE_CREDENTIALENCRYPTIONKEY: "ZTJlLXN0YWNrLW9ubHkta2V5LW5vdC1hLXNlY3JldCE="
      FEDERATION_ALLOWPRIVATEHOSTS: "true"
      # The address the first instance calls this one at, so a peer entry or an invite made
      # here carries something a container can resolve.
      API_BASEURL: http://ember-e2e-peer:8080
    volumes:
      - ..:/home/gradle/project
      # Every Gradle volume is this container's own, the Gradle home included. Two runs cannot
      # share one: the run task stays the foreground process for the life of the container, so
      # the lock it takes on the Gradle home's journal cache is never released and the second
      # container dies at startup with a lock timeout. The cost is one more dependency download
      # the first time, and nothing after that - the volume outlives the container.
      - ember-e2e-peer-gradle-cache:/home/gradle/.gradle
      - ember-e2e-peer-gradle-build:/home/gradle/project/build
      - ember-e2e-peer-project-gradle:/home/gradle/project/.gradle
      - ./config:/home/gradle/project/config
      # Its own data directory, which is what gives it its own discovery identity: the keypair
      # behind the instance id is a file, not a row, so a shared directory would leave both
      # instances answering with the same name.
      - ember-e2e-peer-app-data:/home/gradle/project/data
    depends_on:
      postgres-e2e:
        condition: service_healthy
    profiles:
      - e2e

  # S3-compatible object storage for testing the S3 backend variant.
  # Reach the S3 API from the host at http://localhost:9000 and the admin console at
  # http://localhost:9001 (default login: emberadmin / emberadmin). On first boot
  # the rustfs-init container creates an "ember" bucket so the app can store into it
  # straight away.
  rustfs:
    image: rustfs/rustfs:latest
    container_name: ember_dev_rustfs
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: emberadmin
      RUSTFS_SECRET_KEY: emberadmin
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    volumes:
      - ember-dev-rustfs:/data
    profiles:
      - storage
      - full
      - e2e

  # Creates the "ember" bucket on the rustfs instance, then exits. Polls until rustfs
  # answers; the mb call is idempotent so re-running compose-up is safe.
  rustfs-init:
    image: minio/mc:latest
    container_name: ember_dev_rustfs_init
    profiles:
      - storage
      - full
      - e2e
    depends_on:
      - rustfs
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://rustfs:9000 emberadmin emberadmin 2>/dev/null; do
          echo "Waiting for rustfs to come up..."
          sleep 2
        done
        mc mb --ignore-existing local/ember
        echo "rustfs ready: bucket 'ember' available at http://localhost:9000 (key/secret: emberadmin/emberadmin)"

  # SFTP target for testing the SFTP backend variant.
  # Login from the host: ssh -p 2222 ember@localhost (password: ember), files land
  # under /home/ember/upload inside the container.
  #
  # init.sh chowns the volume to the ember user on every container start. atmoz/sftp
  # only chowns the upload directory the first time the named volume is created; after
  # a restart the existing root-owned volume is mounted as-is, leaving the user without
  # write permission. The init script is idempotent and survives compose down/up cycles.
  sftp:
    image: atmoz/sftp:latest
    container_name: ember_dev_sftp
    ports:
      - "2222:22"
    volumes:
      - ember-dev-sftp:/home/ember/upload
      - ./sftp-init.sh:/etc/sftp.d/chown-upload.sh:ro
      - ./test-ssh/ember_ed25519.pub:/home/ember/.ssh/keys/ember_ed25519.pub:ro
    command: "ember:ember:1001::upload"
    profiles:
      - storage
      - full
      - e2e

  # SMB / Samba share for testing the SMB backend variant.
  # Reach the share from the host on smb://localhost/ember (user: ember, password: ember).
  # Inside the container the share root maps to /share so basePath in the Ember
  # config can stay empty.
  smb:
    image: dperson/samba:latest
    container_name: ember_dev_smb
    ports:
      - "1445:445"
    environment:
      USERID: "1000"
      GROUPID: "1000"
    volumes:
      - ember-dev-smb:/share
    command: >-
      -p
      -u "ember;ember"
      -s "ember;/share;yes;no;no;ember;ember"
      -w "WORKGROUP"
    profiles:
      - storage
      - full
      - e2e

  # Dev backend: bind-mounts the project so source edits land in the container
  # straight away, with named volumes for the Gradle home and the project's
  # build/ output so incremental compilation survives across restarts. Trigger
  # a rebuild after editing code with `docker compose restart ember`.
  ember:
    container_name: ember_dev
    build:
      context: ..
      dockerfile: docker/backend.dev.Dockerfile
    ports:
      - "8888:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ember
      DB_PASSWORD: ember
      DB_DATABASE: ember
      DB_SCHEMA: ember_schema
      DEMO_DEV: "true"
      # Embedded in cross-instance transfer tokens AND used in email links. The compose
      # service name `frontend` resolves to the source's Nuxt container on the shared
      # docker network, so a target container can fetch the source via this URL. Browsers
      # on the host cannot resolve `frontend` - dev-mode email links are accordingly
      # broken in the browser (dev mode does not deliver real mail anyway).
      API_BASEURL: http://frontend:3000
    volumes:
      - ..:/home/gradle/project
      - ember-dev-gradle-cache:/home/gradle/.gradle
      - ember-dev-gradle-build:/home/gradle/project/build
      # Project-local .gradle holds incremental-build state and absolute file paths;
      # isolating it from the host prevents host and container gradle invocations
      # from polluting each other's snapshots with paths the other can't resolve.
      - ember-dev-project-gradle:/home/gradle/project/.gradle
      - ./config:/home/gradle/project/config
      - ./data:/home/gradle/project/data
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - full
      - transfer

  # Dev frontend: Nuxt dev server with HMR. Bind-mounts the source, isolates
  # node_modules in a named volume so the host's install does not shadow it.
  # NUXT_BACKEND_URL points the Nuxt dev proxy at the ember service inside the
  # compose network; the browser talks to Nuxt on :3000 and Nuxt forwards
  # /api/** there.
  frontend:
    container_name: ember_dev_frontend
    build:
      context: ..
      dockerfile: docker/frontend.dev.Dockerfile
    ports:
      - "3000:3000"
    environment:
      NUXT_BACKEND_URL: http://ember:8080
    volumes:
      - ../frontend:/build
      - ember-dev-node-modules:/build/node_modules
    depends_on:
      - ember
    profiles:
      - full
      - transfer

  # ----- Target stack for cross-instance station transfer testing -----
  #
  # The "transfer" profile spins up a second, isolated Ember stack (its own
  # postgres + backend + frontend) alongside the main one so the cross-instance
  # transfer flow can be exercised end to end. Both backends share the default
  # compose network, so the target's import flow can reach the source over
  # container DNS via the `frontend` service name (which Nuxt SSR proxies to
  # the source backend at `ember:8080`).
  #
  # Run with:
  #   docker compose -f docker/compose.dev.yaml --profile transfer up
  #
  # Source (existing) stack:
  #   UI  http://localhost:3000   API  http://localhost:8888
  # Target (new) stack:
  #   UI  http://localhost:3001   API  http://localhost:8889
  #
  # The source URL is embedded in the transfer token (from each backend's
  # API_BASE_URL, set above to the compose service name), so the operator just
  # pastes the token in the target's admin import screen - no separate URL
  # field. The destination resolves the embedded URL on the docker network.
  #
  # Wipe both stacks (including volumes) with:
  #   docker compose -f docker/compose.dev.yaml --profile transfer down -v

  ember_target_db:
    image: postgres:18-alpine
    container_name: ember_dev_target_db
    environment:
      POSTGRES_DB: ember
      POSTGRES_USER: ember
      POSTGRES_PASSWORD: ember
    volumes:
      - ember-dev-target-data:/var/lib/postgresql
    ports:
      - 5433:5432
    profiles:
      - transfer
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ember"]
      interval: 5s
      timeout: 3s
      retries: 10

  ember_target:
    container_name: ember_dev_target
    build:
      context: ..
      dockerfile: docker/backend.dev.Dockerfile
    ports:
      - "8889:8080"
    environment:
      DB_HOST: ember_target_db
      DB_PORT: "5432"
      DB_USER: ember
      DB_PASSWORD: ember
      DB_DATABASE: ember
      DB_SCHEMA: ember_schema
      DEMO_DEV: "true"
      # Same reasoning as the source backend: compose service name so the OTHER
      # stack can fetch this one over the shared docker network. Hyphenated (not
      # `ember_target_frontend`) because Java's URI parser returns null host for
      # names with underscores, which downstream consumers like the WebAuthn
      # relying-party derive rpId from.
      API_BASEURL: http://ember-target-frontend:3000
    volumes:
      - ..:/home/gradle/project
      - ember-dev-target-gradle-cache:/home/gradle/.gradle
      - ember-dev-target-gradle-build:/home/gradle/project/build
      - ember-dev-target-project-gradle:/home/gradle/project/.gradle
      - ./config:/home/gradle/project/config
      - ember-dev-target-app-data:/home/gradle/project/data
    depends_on:
      ember_target_db:
        condition: service_healthy
    profiles:
      - transfer

  ember-target-frontend:
    container_name: ember_dev_target_frontend
    build:
      context: ..
      dockerfile: docker/frontend.dev.Dockerfile
    ports:
      - "3001:3000"
    environment:
      NUXT_BACKEND_URL: http://ember_target:8080
    volumes:
      - ../frontend:/build
      - ember-dev-target-node-modules:/build/node_modules
    depends_on:
      - ember_target
    profiles:
      - transfer

volumes:
  ember-e2e-data:
  ember-e2e-app-data:
  ember-e2e-gradle-cache:
  ember-e2e-gradle-build:
  ember-e2e-project-gradle:
  ember-e2e-peer-app-data:
  ember-e2e-peer-gradle-cache:
  ember-e2e-peer-gradle-build:
  ember-e2e-peer-project-gradle:
  ember-dev-data:
  ember-dev-rustfs:
  ember-dev-sftp:
  ember-dev-smb:
  ember-dev-gradle-cache:
  ember-dev-gradle-build:
  ember-dev-project-gradle:
  ember-dev-node-modules:
  ember-dev-target-data:
  ember-dev-target-app-data:
  ember-dev-target-gradle-cache:
  ember-dev-target-gradle-build:
  ember-dev-target-project-gradle:
  ember-dev-target-node-modules:
