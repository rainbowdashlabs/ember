{% extends '_layout.html' %}
{% block body %}

      <p>You are on the waiting list at <strong>{{ stationName }}</strong>. Please confirm that you are still interested.</p>

      <div class="btn-wrap"><a class="btn-green" href="{{ url }}">Confirm interest</a></div>
{% endblock %}
