{% extends '_layout.html' %}
{% block body %}
      <h2>Hello {{ name }},</h2>
      <p>Your application for the station <strong>{{ stationName }}</strong> has been accepted!</p>
      <p>Your account has been created. Please set your password to get started:</p>
      <div class="btn-wrap"><a class="btn-green" href="{{ url }}">Set Password</a></div>
      <p class="hint">This link expires in 72 hours.</p>
{% endblock %}
