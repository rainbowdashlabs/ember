{% extends '_layout.html' %}
{% block body %}
      <h2>Password Reset</h2>
      <p>Hi {{ name }}, a password reset was requested for your account.</p>
      <p>Click the button below to set a new password:</p>
      <div class="btn-wrap"><a class="btn" href="{{ url }}">Reset Password</a></div>
      <p class="hint">This link expires in 24 hours.</p>
      <p class="hint">If you did not request this, you can ignore this email.</p>
{% endblock %}
